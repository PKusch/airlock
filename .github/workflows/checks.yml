name: checks

# The README promises 76 passing tests and an MIT license. A promise nobody runs
# is a promise that quietly rots. This gate runs the type check and the full test
# suite on every push and pull request, so the claims in the README stay true by
# construction rather than by good intentions.
#
# The four demo scripts (attack, calibrate, audit, unrecognised) print the
# numbers this README quotes, and none of them contain an assertion — they are
# pure console output. A change that broke their output, or made them throw,
# would pass every test here and never be noticed. Running them is not the
# same as checking their numbers (real-corpus.test.ts and calibrate.test.ts
# style tests do that), but it does mean they cannot silently crash unseen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The tests run TypeScript directly via --experimental-strip-types, so they
        # must keep working on both the current LTS and the latest release.
        node: ["22.x", "24.x"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Does the project actually type-check? `lint` is tsc --noEmit.
      - name: Type check
        run: npm run lint

      # The 76 tests the README advertises: constraints, attacks, calibration,
      # symlinks, MCP proxy, the real-corpus audit, the vocabulary gap, the
      # parameter split, MCP annotations and structured payloads.
      - name: Tests
        run: npm test

      - name: Demo scripts still run (attack)
        run: npm run attack

      - name: Demo scripts still run (calibrate)
        run: npm run calibrate

      - name: Demo scripts still run (audit)
        run: npm run audit

      - name: Demo scripts still run (unrecognised)
        run: npm run unrecognised
